<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💠 Veritas Terminal v3.2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.7);
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #888;
            font-size: 1em;
        }

        .api-status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-top: 15px;
        }

        .api-status.online { background: #00ff88; color: #000; }
        .api-status.offline { background: #ff4444; color: #fff; }
        .api-status.checking { background: #ffaa00; color: #000; }

        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-tab {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s;
        }

        .mode-tab:hover {
            border-color: rgba(0, 212, 255, 0.5);
            color: #00d4ff;
        }

        .mode-tab.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .panel {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #00d4ff;
            font-weight: bold;
            font-size: 0.95em;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        .input-group textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            resize: vertical;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .input-mode {
            display: none;
        }

        .input-mode.active {
            display: block;
        }

        .btn-container {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            transition: all 0.3s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-clear {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .entropy-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .entropy-value {
            font-size: 5em;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 30px currentColor;
        }

        .entropy-bar-container {
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 25px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .entropy-bar {
            height: 100%;
            transition: width 0.8s ease, background 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 1.2em;
        }

        .verdict {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            text-transform: uppercase;
            border: 3px solid;
        }

        .verdict.success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border-color: #00ff88;
        }

        .verdict.warning {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
            border-color: #ffaa00;
        }

        .verdict.critical {
            background: rgba(255, 0, 0, 0.3);
            color: #ff0000;
            border-color: #ff0000;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 1em;
            color: #ccc;
            line-height: 1.5;
            border-left: 4px solid #00d4ff;
        }

        .explanation strong {
            color: #00d4ff;
            display: block;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #00d4ff;
        }

        .metric-card.critical {
            border-left-color: #ff4444;
        }

        .metric-card.warning {
            border-left-color: #ffaa00;
        }

        .metric-label {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-value {
            font-size: 1.8em;
            color: #00d4ff;
            font-weight: bold;
        }

        .metric-card.critical .metric-value {
            color: #ff4444;
        }

        .metric-card.warning .metric-value {
            color: #ffaa00;
        }

        .metric-description {
            font-size: 0.8em;
            color: #aaa;
            margin-top: 8px;
            line-height: 1.4;
        }

        .influence-analysis {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            border: 2px solid rgba(255, 170, 0, 0.5);
        }

        .influence-analysis h3 {
            color: #ffaa00;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .influence-result {
            font-size: 1.1em;
            line-height: 1.6;
            color: #e0e0e0;
        }

        .influence-flag {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-right: 10px;
            font-size: 0.9em;
        }

        .flag-danger {
            background: rgba(255, 68, 68, 0.3);
            color: #ff4444;
        }

        .flag-warning {
            background: rgba(255, 170, 0, 0.3);
            color: #ffaa00;
        }

        .flag-safe {
            background: rgba(0, 212, 255, 0.3);
            color: #00d4ff;
        }

        .extracted-text {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.9em;
            line-height: 1.6;
            color: #ccc;
        }

        .extracted-text h4 {
            color: #00d4ff;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .text-length {
            font-size: 0.8em;
            color: #888;
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 10px;
            border-radius: 10px;
        }

        .text-content {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
        }

        .loading {
            text-align: center;
            color: #00d4ff;
            font-size: 1.5em;
            padding: 50px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .error {
            background: rgba(255, 68, 68, 0.3);
            border: 2px solid #ff4444;
            padding: 20px;
            border-radius: 10px;
            color: #ff4444;
            text-align: center;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💠 VERITAS TERMINAL</h1>
            <div class="subtitle">Information Entropy & Influence Analyzer v3.2 Calibrated</div>
            <div class="api-status checking" id="apiStatus">⚙️ Connecting...</div>
        </div>

        <div class="panel">
            <div class="mode-tabs">
                <div class="mode-tab active" onclick="switchMode('url')">
                    🌐 URL Analysis
                </div>
                <div class="mode-tab" onclick="switchMode('text')">
                    📝 Text Analysis
                </div>
            </div>

            <div class="input-mode active" id="urlMode">
                <div class="input-group">
                    <label for="urlInput">🔗 Enter URL:</label>
                    <input 
                        type="text" 
                        id="urlInput" 
                        placeholder="https://www.bbc.com/news/article..."
                    />
                </div>
            </div>

            <div class="input-mode" id="textMode">
                <div class="input-group">
                    <label for="textInput">📝 Paste Text:</label>
                    <textarea 
                        id="textInput" 
                        placeholder="Вставте текст для аналізу..."
                    ></textarea>
                </div>
                <div class="input-group">
                    <label for="sourceInput">📌 Source (optional):</label>
                    <input 
                        type="text" 
                        id="sourceInput" 
                        placeholder="e.g., Scientific Paper, News Article..."
                    />
                </div>
            </div>

            <div class="btn-container">
                <button class="btn" id="analyzeBtn" onclick="analyze()">
                    🔍 ANALYZE
                </button>
                <button class="btn btn-clear" onclick="clearAll()">
                    🗑️ CLEAR
                </button>
            </div>
        </div>

        <div class="panel results" id="resultsPanel">
            <!-- Results will be inserted here by JavaScript -->
        </div>

        <div class="footer">
            <p>💠 Veritas Protocol Terminal v3.2 - Orpheus Calibrated</p>
            <p>Backend: Python Flask (Weighted Scoring + Influence Analysis)</p>
            <p>Co-authored by Dmytro Kholodniak & Chimeric Collective</p>
        </div>
    </div>

    <script>
        const API_URL = '/api/analyze';
        let currentMode = 'url';

        window.addEventListener('load', checkAPI);

        async function checkAPI() {
            const statusEl = document.getElementById('apiStatus');

            try {
                const response = await fetch(API_URL, { method: 'GET' });
                const data = await response.json();

                if (data.status === 'online') {
                    statusEl.textContent = '✅ API Online';
                    statusEl.className = 'api-status online';
                } else {
                    throw new Error('Unhealthy');
                }
            } catch (error) {
                statusEl.textContent = '❌ API Offline';
                statusEl.className = 'api-status offline';
            }
        }

        function switchMode(mode) {
            currentMode = mode;

            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.remove('active');
            });

            const urlModeEl = document.getElementById('urlMode');
            const textModeEl = document.getElementById('textMode');

            if (mode === 'url') {
                document.querySelector('.mode-tab:nth-child(1)').classList.add('active');
                urlModeEl.classList.add('active');
                textModeEl.classList.remove('active');
                document.getElementById('textInput').value = '';
                document.getElementById('sourceInput').value = '';
            } else {
                document.querySelector('.mode-tab:nth-child(2)').classList.add('active');
                textModeEl.classList.add('active');
                urlModeEl.classList.remove('active');
                document.getElementById('urlInput').value = '';
            }

            const extractedContainer = document.getElementById('extractedTextContainer');
            if (extractedContainer) {
                extractedContainer.style.display = 'none';
            }
        }

        async function analyze() {
            const analyzeBtn = document.getElementById('analyzeBtn');
            const urlInput = document.getElementById('urlInput').value.trim();
            const textInput = document.getElementById('textInput').value.trim();
            const sourceInput = document.getElementById('sourceInput').value.trim();
            const resultsPanel = document.getElementById('resultsPanel');

            if ((currentMode === 'url' && !urlInput) || (currentMode === 'text' && !textInput)) {
                alert('Будь ласка, введіть ' + (currentMode === 'url' ? 'URL' : 'текст'));
                return;
            }

            analyzeBtn.disabled = true;
            analyzeBtn.textContent = '⏳ ANALYZING...';

            resultsPanel.classList.remove('show');
            resultsPanel.innerHTML = '<div class="loading">⏳ Аналіз запущено...</div>';

            try {
                const requestData = currentMode === 'url' ? { url: urlInput } : { 
                    text: textInput,
                    source: sourceInput || 'Manual Input'
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Помилка сервера');
                }

                displayResults(result);

            } catch (error) {
                resultsPanel.innerHTML = `
                    <div class="error">
                        ❌ Помилка: ${error.message}
                    </div>
                `;
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = '🔍 ANALYZE';
                resultsPanel.classList.add('show');
            }
        }

        function displayResults(data) {
            const resultsPanel = document.getElementById('resultsPanel');
            const statusClass = data.status_class || 'success';

            const getBarColor = (status) => {
                switch(status) {
                    case 'success': return '#00ff88';
                    case 'warning': return '#ffaa00';
                    case 'critical': return '#ff0000';
                    default: return '#888';
                }
            };

            const getBarWidth = (entropy) => Math.min(100, Math.max(5, entropy * 100));

            const metrics = [
                { label: 'ЕНТРОПІЯ ШЕННОНА', value: data.shannon_entropy, desc: 'Міра випадковості та невизначеності в тексті' },
                { label: 'СКЛАДНІСТЬ', value: data.complexity, desc: 'Структурна складність тексту' },
                { label: 'ІНДЕКС ХАОСУ', value: data.total_chaos_index, desc: 'Загальний рівень інформаційного хаосу' },
                { label: 'МАРКЕРИ ШУМУ', value: data.noise_markers, desc: 'Кількість слів, що створюють емоційний шум' },
                { label: 'МАРКЕРИ СИГНАЛУ', value: data.signal_markers, desc: 'Кількість логічних та фактологічних слів' },
                { label: 'МАРКЕРИ ХАОСУ', value: data.chaos_markers, desc: 'Позначки конспірології та псевдонауки' },
                { label: 'ФАКТОР КРИКУ', value: data.shout_factor, desc: 'Використання капслоку та знаків оклику' },
                { label: 'ЩІЛЬНІСТЬ ЧИСЕЛ', value: data.number_density, desc: 'Частота використання чисел' },
                { label: 'ШТРАФ САНІТАРІЇ', value: data.sanity_penalty, desc: 'Порушення логічної сумісності' },
                { label: 'ІНДЕКС ВПЛИВУ', value: data.impact_score, desc: 'Загальний індекс впливу на основі всіх метрик' },
                { label: 'СЛІВ', value: data.word_count, desc: 'Загальна кількість слів' },
                { label: 'СИМВОЛІВ', value: data.char_count, desc: 'Загальна кількість символів' }
            ];

            const influenceHTML = data.emotional_pressure || data.disorientation_risk ? `
                <div class="influence-analysis">
                    <h3>🧠 АНАЛІЗ ЕМОЦІЙНОГО ВПЛИВУ ТА ДЕЗОРІЄНТАЦІЇ</h3>
                    <div class="influence-result">
                        ${data.emotional_pressure ? '<span class="influence-flag flag-danger">ЕМОЦІЙНИЙ ТИСК</span>' : ''}
                        ${data.disorientation_risk ? '<span class="influence-flag flag-warning">РИЗИК ДЕЗОРІЄНТАЦІЇ</span>' : ''}
                        ${!data.emotional_pressure && !data.disorientation_risk ? '<span class="influence-flag flag-safe">МІНІМАЛЬНИЙ ВПЛИВ</span>' : ''}
                        <p>${data.emotional_analysis || 'Аналіз не доступний.'}</p>
                    </div>
                </div>
            ` : '';

            const metricsHTML = metrics.map(metric => {
                const isCritical = (metric.label.includes('ІНДЕКС ХАОСУ') && metric.value > 40) || 
                                  (metric.label.includes('ЕНТРОПІЯ') && metric.value > 0.65);
                const isWarning = (metric.label.includes('ІНДЕКС ХАОСУ') && metric.value > 20) || 
                                 (metric.label.includes('ЕНТРОПІЯ') && metric.value > 0.50);
                const cardClass = isCritical ? 'critical' : (isWarning ? 'warning' : '');
                return `
                    <div class="metric-card ${cardClass}">
                        <div class="metric-label">${metric.label}</div>
                        <div class="metric-value">${typeof metric.value === 'number' ? metric.value.toFixed(3) : metric.value}</div>
                        <div class="metric-description">${metric.desc}</div>
                    </div>
                `;
            }).join('');

            const extractedTextHTML = data.extracted_text ? `
                <div class="extracted-text" id="extractedTextContainer">
                    <h4>📄 Текст для аналізу:
                        <span class="text-length">${data.extracted_text_length} символів</span>
                    </h4>
                    <div class="text-content">${data.extracted_text}</div>
                </div>
            ` : '';

            resultsPanel.innerHTML = `
                <div class="entropy-display">
                    <h2>📊 РЕЗУЛЬТАТ АНАЛІЗУ</h2>
                    <div class="entropy-value" style="color: ${getBarColor(statusClass)}">
                        ${data.entropy ? data.entropy.toFixed(3) : 'N/A'}
                    </div>
                    <div class="entropy-bar-container">
                        <div class="entropy-bar" 
                             style="width: ${getBarWidth(data.entropy)}%; 
                                    background: ${getBarColor(statusClass)};">
                            ${data.entropy ? (data.entropy * 100).toFixed(1) + '%' : ''}
                        </div>
                    </div>
                </div>

                <div class="verdict ${statusClass}">
                    ${data.verdict || 'Немає вердикту'}
                </div>

                <div class="explanation">
                    <strong>📝 Пояснення:</strong> ${data.explanation || 'Немає пояснення.'}
                </div>

                ${influenceHTML}

                <div class="metrics-grid">
                    ${metricsHTML}
                </div>

                ${extractedTextHTML}
            `;

            resultsPanel.classList.add('show');
        }

        function clearAll() {
            document.getElementById('urlInput').value = '';
            document.getElementById('textInput').value = '';
            document.getElementById('sourceInput').value = '';
            document.getElementById('resultsPanel').innerHTML = '';
            document.getElementById('resultsPanel').classList.remove('show');
        }
    </script>
</body>
</html>
