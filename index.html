<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💠 Veritas Terminal v3.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.7);
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #888;
            font-size: 1em;
        }

        .api-status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-top: 15px;
        }

        .api-status.online { background: #00ff88; color: #000; }
        .api-status.offline { background: #ff4444; color: #fff; }
        .api-status.checking { background: #ffaa00; color: #000; }

        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-tab {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s;
        }

        .mode-tab:hover {
            border-color: rgba(0, 212, 255, 0.5);
            color: #00d4ff;
        }

        .mode-tab.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .panel {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #00d4ff;
            font-weight: bold;
            font-size: 0.95em;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        .input-group textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            resize: vertical;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .input-mode {
            display: none;
        }

        .input-mode.active {
            display: block;
        }

        .btn-container {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            transition: all 0.3s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-clear {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .entropy-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .entropy-value {
            font-size: 5em;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 30px currentColor;
        }

        .entropy-bar-container {
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 25px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .entropy-bar {
            height: 100%;
            transition: width 0.8s ease, background 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 1.2em;
        }

        .verdict {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            text-transform: uppercase;
            border: 3px solid;
        }

        .verdict.trusted {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border-color: #00ff88;
        }

        .verdict.acceptable {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            border-color: #00d4ff;
        }

        .verdict.suspicious {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
            border-color: #ffaa00;
        }

        .verdict.warning {
            background: rgba(255, 100, 100, 0.2);
            color: #ff6464;
            border-color: #ff6464;
        }

        .verdict.critical {
            background: rgba(255, 0, 0, 0.3);
            color: #ff0000;
            border-color: #ff0000;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .diagnostics {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }

        .diagnostics h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .diag-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .diag-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #00d4ff;
        }

        .diag-label {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 5px;
        }

        .diag-value {
            font-size: 1.3em;
            color: #00d4ff;
            font-weight: bold;
        }

        .extracted-text {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.9em;
            line-height: 1.6;
            color: #ccc;
        }

        .extracted-text h4 {
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            color: #00d4ff;
            font-size: 1.5em;
            padding: 50px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .error {
            background: rgba(255, 68, 68, 0.3);
            border: 2px solid #ff4444;
            padding: 20px;
            border-radius: 10px;
            color: #ff4444;
            text-align: center;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💠 VERITAS TERMINAL</h1>
            <div class="subtitle">Information Entropy Analyzer v3.1 Calibrated (Orpheus)</div>
            <div class="api-status checking" id="apiStatus">⚙️ Connecting...</div>
        </div>

        <div class="panel">
            <div class="mode-tabs">
                <div class="mode-tab active" onclick="switchMode('url')">
                    🌐 URL Analysis
                </div>
                <div class="mode-tab" onclick="switchMode('text')">
                    📝 Text Analysis
                </div>
            </div>

            <div class="input-mode active" id="urlMode">
                <div class="input-group">
                    <label for="urlInput">🔗 Enter URL:</label>
                    <input 
                        type="text" 
                        id="urlInput" 
                        placeholder="https://www.bbc.com/news/article..."
                    />
                </div>
            </div>

            <div class="input-mode" id="textMode">
                <div class="input-group">
                    <label for="textInput">📝 Paste Text:</label>
                    <textarea 
                        id="textInput" 
                        placeholder="Вставте текст для аналізу..."
                    ></textarea>
                </div>
                <div class="input-group">
                    <label for="sourceInput">📌 Source (optional):</label>
                    <input 
                        type="text" 
                        id="sourceInput" 
                        placeholder="e.g., Scientific Paper, News Article..."
                    />
                </div>
            </div>

            <div class="btn-container">
                <button class="btn" id="analyzeBtn" onclick="analyze()">
                    🔍 ANALYZE
                </button>
                <button class="btn btn-clear" onclick="clearAll()">
                    🗑️ CLEAR
                </button>
            </div>
        </div>

        <div class="panel results" id="resultsPanel">
            <!-- Results will be inserted here -->
        </div>

        <div class="footer">
            <p>💠 Veritas Protocol Terminal v3.1 - Orpheus Calibrated</p>
            <p>Backend: Python Flask (Weighted Scoring + Academic Context)</p>
            <p>Co-authored by Dmytro Kholodniak & Chimeric Collective</p>
        </div>
    </div>

    <script>
        const API_URL = '/api/analyze';
        let currentMode = 'url';

        window.addEventListener('load', checkAPI);

        async function checkAPI() {
            const statusEl = document.getElementById('apiStatus');
            
            try {
                const response = await fetch(API_URL, { method: 'GET' });
                const data = await response.json();
                
                if (data.status === 'online') {
                    statusEl.textContent = '✅ API Online';
                    statusEl.className = 'api-status online';
                } else {
                    throw new Error('Unhealthy');
                }
            } catch (error) {
                statusEl.textContent = '❌ API Offline';
                statusEl.className = 'api-status offline';
            }
        }

       function switchMode(mode, element) {
    currentMode = mode;
    
    // 1. Оновлюємо вигляд вкладок (табів)
    document.querySelectorAll('.mode-tab').forEach(tab => {
        tab.classList.remove('active');
    });

    // Якщо ми передали 'this' у функцію — підсвічуємо його, 
    // інакше шукаємо через event (для страховки)
    if (element) {
        element.classList.add('active');
    } else if (window.event) {
        window.event.target.classList.add('active');
    }
    
    // 2. Перемикаємо видимість контейнерів для вводу
    const urlModeEl = document.getElementById('urlMode');
    const textModeEl = document.getElementById('textMode');
    
    if (mode === 'url') {
        urlModeEl.classList.add('active');
        textModeEl.classList.remove('active');
        // Очищуємо поле тексту, якщо перейшли на URL (за бажанням)
        document.getElementById('textContent').value = ''; 
    } else {
        textModeEl.classList.add('active');
        urlModeEl.classList.remove('active');
        // Очищуємо поле URL, якщо перейшли на текст
        document.getElementById('urlInput').value = '';
    }

    // 3. Ховаємо блок з витягнутим текстом при зміні режиму, 
    // щоб старі результати не муляли очі
    const extractedContainer = document.getElementById('extractedTextContainer');
    if (extractedContainer) {
        extractedContainer.style.display = 'none';
    }
}

       async function analyze() {
            const analyzeBtn = document.getElementById('analyzeBtn');
            const resultsPanel = document.getElementById('resultsPanel');

            let payload = {};
            if (currentMode === 'url') {
                const url = document.getElementById('urlInput').value.trim();
                if (!url) { alert('❌ Please enter a URL'); return; }
                payload = { url };
            } else {
                const text = document.getElementById('textInput').value.trim();
                const source = document.getElementById('sourceInput').value.trim();
                if (!text) { alert('❌ Please enter text'); return; }
                payload = { text, source: source || 'Manual Input' };
            }

            analyzeBtn.disabled = true;
            analyzeBtn.textContent = '⏳ ANALYZING...';
            resultsPanel.innerHTML = '<div class="loading">⚙️ Processing with calibrated engine...</div>';
            resultsPanel.classList.add('show');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                // ФОРМУЄМО ВИВІД РЕЗУЛЬТАТІВ
                // Тут ми малюємо вердикт, графіки і ТІЛЬКИ ЯКЩО ТРЕБА - текст
                resultsPanel.innerHTML = `
                    <div class="result-header ${data.status_class || 'success'}">
                        <h3>${data.verdict || 'ANALYSIS COMPLETE'}</h3>
                        <p>${data.explanation || ''}</p>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="label">Entropy</span>
                            <span class="value">${data.entropy_score || data.shannon_entropy}</span>
                        </div>
                        <div class="stat-item">
                            <span class="label">Chaos Markers</span>
                            <span class="value">${data.chaos_markers}</span>
                        </div>
                    </div>

                    ${(currentMode === 'url' && data.extracted_text) ? `
                        <div id="extractedTextContainer" class="extracted-box">
                            <strong>Extracted Content:</strong>
                            <div class="text-preview">${data.extracted_text}</div>
                        </div>
                    ` : ''}
                `;

            } catch (error) {
                resultsPanel.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = '🚀 ANALYZE SIGNAL';
            }
        }

        function displayResults(result) {
            const resultsPanel = document.getElementById('resultsPanel');
            const entropy = result.entropy;
            const status = result.status.toLowerCase();

            let html = `
                <div class="entropy-display">
                    <div class="entropy-value" style="color: ${getEntropyColor(entropy)}">
                        ${entropy.toFixed(3)}
                    </div>
                    
                    <div class="entropy-bar-container">
                        <div class="entropy-bar" 
                             style="width: ${Math.round(entropy * 100)}%; background: ${getEntropyGradient(entropy)};">
                            ${Math.round(entropy * 100)}%
                        </div>
                    </div>

                    <div class="verdict ${status}">
                        ${result.verdict}
                    </div>
                </div>
            `;

            // Extracted text (for URL mode)
            if (result.extracted_text) {
                html += `
                    <div class="extracted-text">
                        <h4>📄 Extracted Text Preview:</h4>
                        <div>${result.extracted_text}</div>
                    </div>
                `;
            }

            // Diagnostics
            html += `
                <div class="diagnostics">
                    <h3>📊 DIAGNOSTICS</h3>
                    <div class="diag-grid">
            `;

            if (result.diagnostics) {
                const diag = result.diagnostics;
                
                const items = [
                    ['Shannon Entropy', diag.shannon_entropy || 'N/A'],
                    ['Complexity', diag.complexity || 'N/A'],
                    ['Signal Markers', diag.signal_markers || 'N/A'],
                    ['Noise Markers', diag.noise_markers || 'N/A'],
                    ['Chaos Markers', diag.chaos_markers || 0],
                    ['Chaos Density', diag.chaos_density ? (diag.chaos_density * 100).toFixed(2) + '%' : 'N/A'],
                    ['Academic Markers', diag.academic_markers || 0],
                    ['Academic Context', diag.is_academic_context ? 'YES ✅' : 'NO'],
                    ['Number Density', diag.number_density || 'N/A'],
                    ['Shout Factor', diag.shout_factor || 'N/A'],
                    ['Sanity Penalty', diag.sanity_penalty || 'N/A'],
                    ['Word Count', diag.word_count || 'N/A'],
                    ['Language', result.language || 'N/A'],
                    ['Source', result.source || 'Unknown']
                ];

                items.forEach(([label, value]) => {
                    let borderColor = '#00d4ff';
                    if (label === 'Sanity Penalty' && diag.sanity_violations) {
                        borderColor = '#ff0000';
                    }
                    if (label === 'Chaos Density' && diag.chaos_density > 0.05) {
                        borderColor = '#ff0000';
                    }
                    
                    html += `
                        <div class="diag-item" style="border-left-color: ${borderColor};">
                            <div class="diag-label">${label}</div>
                            <div class="diag-value">${value}</div>
                        </div>
                    `;
                });
            }

            html += `</div></div>`;
            resultsPanel.innerHTML = html;
        }

        function getEntropyColor(entropy) {
            if (entropy < 0.35) return '#00ff88';
            if (entropy < 0.55) return '#00d4ff';
            if (entropy < 0.75) return '#ffaa00';
            if (entropy < 0.85) return '#ff6464';
            return '#ff0000';
        }

        function getEntropyGradient(entropy) {
            if (entropy < 0.35) return 'linear-gradient(90deg, #00ff88, #00cc66)';
            if (entropy < 0.55) return 'linear-gradient(90deg, #00d4ff, #0099ff)';
            if (entropy < 0.75) return 'linear-gradient(90deg, #ffaa00, #ff8800)';
            if (entropy < 0.85) return 'linear-gradient(90deg, #ff6464, #ff4444)';
            return 'linear-gradient(90deg, #ff0000, #cc0000)';
        }

        function clearAll() {
            document.getElementById('urlInput').value = '';
            document.getElementById('textInput').value = '';
            document.getElementById('sourceInput').value = '';
            document.getElementById('resultsPanel').classList.remove('show');
        }
    </script>
</body>
</html>
